<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030303">
    <title>Pivot Auth Demo - Enterprise Platform</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --bg-primary: #030303;
            --bg-secondary: #0a0a0b;
            --bg-tertiary: #111113;
            --bg-quaternary: #18181b;
            --surface: #1a1a1e;
            --surface-hover: #222226;
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --border-active: rgba(139,92,246,0.3);
            --purple-300: #c4b5fd;
            --purple-400: #a78bfa;
            --purple-500: #8b5cf6;
            --purple-600: #7c3aed;
            --pink-400: #f472b6;
            --pink-500: #ec4899;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-tertiary: #71717a;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            --radius-xs: 6px;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-full: 9999px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.6);
            --shadow-purple: 0 0 40px rgba(139,92,246,0.15);
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: 500ms cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(16px, 4vw, 24px);
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: -200px;
            left: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139,92,246,0.08), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: bgGlow 6s ease-in-out infinite;
            z-index: 0;
        }
        
        body::after {
            content: '';
            position: fixed;
            bottom: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(236,72,153,0.06), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: bgGlow 6s ease-in-out infinite;
            animation-delay: -3s;
            z-index: 0;
        }
        
        .container {
            width: min(100%, 480px);
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s var(--transition-spring);
        }
        
        .logo-area {
            text-align: center;
            margin-bottom: clamp(24px, 5vw, 32px);
        }
        
        .logo-wrapper {
            display: inline-block;
            position: relative;
            margin-bottom: 16px;
        }
        
        .logo-wrapper::after {
            content: '';
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle, rgba(139,92,246,0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: logoGlow 3s ease-in-out infinite;
            z-index: -1;
        }
        
        .app-name {
            font-size: clamp(24px, 5vw, 32px);
            font-weight: 900;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--purple-400), var(--pink-500), var(--purple-500));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 4s ease-in-out infinite;
        }
        
        .app-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: var(--radius-full);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            background: rgba(139,92,246,0.08);
            border: 1px solid rgba(139,92,246,0.15);
            color: var(--purple-400);
            margin-top: 8px;
        }
        
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: clamp(24px, 5vw, 32px);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            transition: border-color var(--transition-base);
        }
        
        .card:hover {
            border-color: var(--border-hover);
        }
        
        .card-header {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .card-title {
            font-size: clamp(20px, 4vw, 24px);
            font-weight: 800;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
        }
        
        .card-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        
        .btn {
            width: 100%;
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.01em;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: none;
        }
        
        .btn:active {
            transform: scale(0.97);
        }
        
        .btn-pivot {
            background: linear-gradient(135deg, var(--purple-500), var(--purple-600));
            color: white;
            box-shadow: var(--shadow-md), 0 4px 20px rgba(139,92,246,0.3);
        }
        
        .btn-pivot:hover {
            box-shadow: var(--shadow-lg), 0 6px 30px rgba(139,92,246,0.5);
            transform: translateY(-2px);
        }
        
        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        
        .btn-outline:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }
        
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        
        .divider-text {
            font-size: 11px;
            color: var(--text-tertiary);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        
        .user-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            margin-bottom: 20px;
        }
        
        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--purple-500), var(--pink-500));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: white;
            flex-shrink: 0;
        }
        
        .user-info {
            flex: 1;
            min-width: 0;
        }
        
        .user-name {
            font-size: 14px;
            font-weight: 600;
        }
        
        .user-email {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 10px;
            font-weight: 700;
        }
        
        .badge-success {
            background: rgba(16,185,129,0.08);
            color: var(--success);
            border: 1px solid rgba(16,185,129,0.15);
        }
        
        .badge-pending {
            background: rgba(245,158,11,0.08);
            color: var(--warning);
            border: 1px solid rgba(245,158,11,0.15);
        }
        
        .features {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
        }
        
        .feature-item:hover {
            border-color: var(--border-hover);
            background: var(--bg-quaternary);
            transform: translateX(4px);
        }
        
        .feature-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .feature-icon.shield {
            background: rgba(139,92,246,0.08);
            color: var(--purple-400);
            border: 1px solid rgba(139,92,246,0.15);
        }
        
        .feature-icon.check {
            background: rgba(16,185,129,0.08);
            color: var(--success);
            border: 1px solid rgba(16,185,129,0.15);
        }
        
        .feature-icon.lock {
            background: rgba(59,130,246,0.08);
            color: var(--info);
            border: 1px solid rgba(59,130,246,0.15);
        }
        
        .feature-info {
            flex: 1;
        }
        
        .feature-name {
            font-size: 13px;
            font-weight: 600;
        }
        
        .feature-desc {
            font-size: 11px;
            color: var(--text-tertiary);
        }
        
        .token-box {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--purple-400);
            word-break: break-all;
            line-height: 1.6;
            margin-top: 8px;
        }
        
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        
        .hidden {
            display: none !important;
        }
        
        @keyframes bgGlow {
            0%, 100% { opacity: 0.06; transform: scale(1); }
            50% { opacity: 0.1; transform: scale(1.1); }
        }
        
        @keyframes logoGlow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container" id="app"></div>

<script>
const PIVOT_AUTH_URL = 'https://pivot-auth-two.vercel.app/auth.html';
const APP_ID = 'pivot_app_7qf08lzy6ws';
const API_KEY = 'pivot_key_mkvd83sit';

const ICONS = {
    logo: `<svg width="48" height="48" viewBox="0 0 48 48" fill="none"><defs><linearGradient id="lg" x1="0" y1="0" x2="48" y2="48"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient></defs><rect x="4" y="4" width="40" height="40" rx="12" fill="url(#lg)" opacity="0.15"/><rect x="8" y="8" width="32" height="32" rx="8" fill="url(#lg)"/><path d="M24 16C19.6 16 16 19.6 16 24C16 28.4 19.6 32 24 32C28.4 32 32 28.4 32 24C32 19.6 28.4 16 24 16ZM24 28C21.8 28 20 26.2 20 24C20 21.8 21.8 20 24 20C26.2 20 28 21.8 28 24C28 26.2 26.2 28 24 28Z" fill="white"/><path d="M24 22L26 24L24 26L22 24L24 22Z" fill="white" opacity="0.5"/></svg>`,
    shield: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L3 7V12C3 17.5 6.5 22.5 12 23C17.5 22.5 21 17.5 21 12V7L12 2Z"/><path d="M9 12L11 14L15 10"/></svg>`,
    check: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
    lock: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7C7 4.2 9.2 2 12 2C14.8 2 17 4.2 17 7V11"/></svg>`,
    logout: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5C3.9 21 3 20.1 3 19V5C3 3.9 3.9 3 5 3H9"/><path d="M16 17L21 12L16 7"/><path d="M21 12H9"/></svg>`,
    pivot: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L20 7V17L12 22L4 17V7L12 2Z"/><path d="M12 22V12"/><path d="M20 7L12 12L4 7"/></svg>`
};

function checkCallback() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    
    if (error) {
        renderError(error);
        return true;
    }
    
    if (code) {
        renderProcessing();
        exchangeCodeForToken(code);
        return true;
    }
    
    return false;
}

async function exchangeCodeForToken(code) {
    try {
        const response = await fetch('https://pivot-auth-two.vercel.app/api/oauth?action=token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                code: code,
                clientId: APP_ID,
                clientSecret: API_KEY
            })
        });
        
        const data = await response.json();
        
        if (data.success && data.access_token) {
            const userResponse = await fetch('https://pivot-auth-two.vercel.app/api/oauth?action=userinfo', {
                headers: { 'Authorization': `Bearer ${data.access_token}` }
            });
            
            const userData = await userResponse.json();
            
            renderAuthenticated(userData.user, data);
            window.history.replaceState({}, document.title, window.location.pathname);
        } else {
            renderError(data.error || 'Failed to exchange code');
        }
    } catch (error) {
        renderError('Failed to communicate with Pivot Auth');
    }
}

function renderLogin() {
    document.getElementById('app').innerHTML = `
        <div class="logo-area">
            <div class="logo-wrapper">${ICONS.logo}</div>
            <div class="app-name">PIVOT AUTH DEMO</div>
            <div class="app-badge">${ICONS.pivot} ENTERPRISE PLATFORM</div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <div class="card-title">Welcome to the Demo</div>
                <div class="card-subtitle">Experience enterprise-grade authentication with Pivot Auth</div>
            </div>
            
            <button class="btn btn-pivot" onclick="loginWithPivot()">
                ${ICONS.pivot} Sign in with Pivot Auth
            </button>
            
            <div class="divider">
                <span class="divider-text">Enterprise Security</span>
            </div>
            
            <div class="features">
                <div class="feature-item">
                    <div class="feature-icon shield">${ICONS.shield}</div>
                    <div class="feature-info">
                        <div class="feature-name">Two-Factor Authentication</div>
                        <div class="feature-desc">Enhanced security with 2FA verification</div>
                    </div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon check">${ICONS.check}</div>
                    <div class="feature-info">
                        <div class="feature-name">Verified Identity</div>
                        <div class="feature-desc">Enterprise-grade user verification</div>
                    </div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon lock">${ICONS.lock}</div>
                    <div class="feature-info">
                        <div class="feature-name">Secure Sessions</div>
                        <div class="feature-desc">Protected access with token management</div>
                    </div>
                </div>
            </div>
        </div>
    `;
}

function renderProcessing() {
    document.getElementById('app').innerHTML = `
        <div class="logo-area">
            <div class="logo-wrapper">${ICONS.logo}</div>
            <div class="app-name">PIVOT AUTH DEMO</div>
        </div>
        <div class="card">
            <div style="text-align:center;padding:20px;">
                <div class="spinner" style="margin:0 auto 16px;width:24px;height:24px;color:var(--purple-400);"></div>
                <p style="color:var(--text-secondary);font-size:13px;">Processing authorization...</p>
            </div>
        </div>
    `;
}

function renderError(message) {
    document.getElementById('app').innerHTML = `
        <div class="logo-area">
            <div class="logo-wrapper">${ICONS.logo}</div>
            <div class="app-name">PIVOT AUTH DEMO</div>
        </div>
        <div class="card">
            <div class="card-header">
                <div class="card-title" style="color:var(--error);">Authorization Failed</div>
                <div class="card-subtitle">${message}</div>
            </div>
            <button class="btn btn-pivot" onclick="window.location.href=window.location.pathname">
                Try Again
            </button>
        </div>
    `;
}

function renderAuthenticated(user, tokenData) {
    const initials = (user?.name || user?.email || 'U').charAt(0).toUpperCase();
    const has2FA = user?.twoFAEnabled || false;
    
    document.getElementById('app').innerHTML = `
        <div class="logo-area">
            <div class="logo-wrapper">${ICONS.logo}</div>
            <div class="app-name">PIVOT AUTH DEMO</div>
            <div class="app-badge">${ICONS.check} AUTHENTICATED</div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <div class="card-title">Welcome Back!</div>
                <div class="card-subtitle">You are securely authenticated via Pivot Auth</div>
            </div>
            
            <div class="user-card">
                <div class="user-avatar">${initials}</div>
                <div class="user-info">
                    <div class="user-name">${user?.name || user?.email || 'User'}</div>
                    <div class="user-email">${user?.email || ''}</div>
                </div>
                <span class="badge ${has2FA ? 'badge-success' : 'badge-pending'}">
                    ${has2FA ? ICONS.check + ' 2FA Active' : ICONS.shield + ' 2FA Pending'}
                </span>
            </div>
            
            <div class="features">
                <div class="feature-item">
                    <div class="feature-icon check" style="background: rgba(16,185,129,0.08); color: var(--success); border: 1px solid rgba(16,185,129,0.15);">
                        ${ICONS.check}
                    </div>
                    <div class="feature-info">
                        <div class="feature-name">Authentication Successful</div>
                        <div class="feature-desc">Your identity has been verified by Pivot Auth</div>
                    </div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon shield">
                        ${ICONS.shield}
                    </div>
                    <div class="feature-info">
                        <div class="feature-name">Enterprise Security</div>
                        <div class="feature-desc">${has2FA ? '2FA protection is active' : '2FA protection available'}</div>
                    </div>
                </div>
            </div>
            
            ${tokenData?.access_token ? `
                <div style="margin-top:16px;">
                    <div style="font-size:11px;color:var(--text-tertiary);margin-bottom:8px;">ACCESS TOKEN</div>
                    <div class="token-box">${tokenData.access_token.substring(0, 50)}...</div>
                </div>
            ` : ''}
            
            <button class="btn btn-outline" onclick="handleLogout()" style="margin-top:20px;">
                ${ICONS.logout} Sign Out
            </button>
        </div>
    `;
}

window.loginWithPivot = function() {
    window.location.href = `${PIVOT_AUTH_URL}?appId=${APP_ID}`;
};

window.handleLogout = function() {
    window.location.href = window.location.pathname;
};

if (!checkCallback()) {
    renderLogin();
}
</script>

</body>
</html>
