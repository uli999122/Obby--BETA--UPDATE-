<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pivot Box - Reproductor Test</title>
    <style>
        :root{--bg:#0a0a0a;--surface:#111;--text:#fff;--text2:#888;--accent:#f59e0b;--gradient:linear-gradient(135deg,#f59e0b,#ef4444)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;color:var(--text)}
        h1{font-size:22px;margin-bottom:8px;background:var(--gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        .subtitle{font-size:11px;color:var(--text2);margin-bottom:20px}
        
        .player-shell{width:100%;max-width:850px;background:#000;border-radius:18px;overflow:hidden;position:relative;box-shadow:0 0 70px rgba(245,158,11,0.15),0 25px 60px rgba(0,0,0,0.9);animation:playerIn 0.5s ease}
        @keyframes playerIn{from{opacity:0;transform:translateY(25px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
        @keyframes pulse{0%,100%{box-shadow:0 0 18px rgba(245,158,11,0.4)}50%{box-shadow:0 0 35px rgba(245,158,11,0.9)}}
        @keyframes gradientMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes dotPulse{0%,80%,100%{transform:scale(0);opacity:0}40%{transform:scale(1);opacity:1}}
        @keyframes rippleAnim{from{transform:scale(0);opacity:1}to{transform:scale(5);opacity:0}}
        @keyframes slideUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
        @keyframes neon{0%,100%{text-shadow:0 0 6px rgba(245,158,11,0.5)}50%{text-shadow:0 0 14px rgba(245,158,11,0.9)}}
        @keyframes watermarkPulse{0%,100%{opacity:0.5}50%{opacity:1}}
        
        .player-shell video{width:100%;display:block;max-height:520px;object-fit:contain;background:#000;cursor:pointer}
        
        .play-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:75px;height:75px;background:rgba(245,158,11,0.92);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;animation:pulse 2.5s infinite;transition:all 0.3s;border:none}
        .play-overlay:hover{transform:translate(-50%,-50%) scale(1.1);background:#f59e0b}
        .play-overlay svg{width:32px;height:32px;fill:#000;margin-left:3px}
        .play-overlay.hidden{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(0.5)}
        
        .top-gradient{position:absolute;top:0;left:0;right:0;height:70px;background:linear-gradient(to bottom,rgba(0,0,0,0.7),transparent);pointer-events:none;z-index:2;opacity:0;transition:opacity 0.4s}
        .bottom-gradient{position:absolute;bottom:0;left:0;right:0;height:100px;background:linear-gradient(to top,rgba(0,0,0,0.8),transparent);pointer-events:none;z-index:2;opacity:0;transition:opacity 0.4s}
        
        .player-shell.idle .top-gradient,.player-shell.idle .bottom-gradient{opacity:0}
        .player-shell:not(.idle) .top-gradient,.player-shell:not(.idle) .bottom-gradient{opacity:1}
        
        .title-overlay{position:absolute;top:16px;left:20px;font-size:13px;font-weight:700;z-index:5;animation:neon 3s infinite;pointer-events:none;transition:opacity 0.4s}
        .player-shell.idle .title-overlay{opacity:0}
        
        .watermark{position:absolute;bottom:14px;right:16px;display:flex;align-items:center;gap:4px;font-size:9px;color:rgba(255,255,255,0.6);z-index:5;pointer-events:none;animation:watermarkPulse 3s infinite;transition:opacity 0.4s}
        .watermark svg{width:11px;height:11px;fill:#f59e0b}
        
        .spinner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border:3px solid rgba(245,158,11,0.2);border-top-color:#f59e0b;border-radius:50%;animation:spin 0.8s linear infinite;z-index:8;display:none}
        
        .controls{padding:16px 20px;position:relative;z-index:6;transition:opacity 0.4s,transform 0.4s}
        .player-shell.idle .controls{opacity:0;transform:translateY(10px)}
        
        .progress{width:100%;height:5px;background:rgba(255,255,255,0.1);border-radius:10px;cursor:pointer;margin-bottom:12px;position:relative}
        .progress-bar{position:absolute;left:0;top:0;height:100%;background:var(--gradient);background-size:200% 100%;animation:gradientMove 3s ease infinite;border-radius:10px;width:0%}
        .progress-knob{position:absolute;top:50%;width:14px;height:14px;background:#f59e0b;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 12px rgba(245,158,11,0.9);opacity:0;transition:opacity 0.2s;pointer-events:none}
        .progress:hover .progress-knob{opacity:1}
        
        .controls-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
        .left-group,.right-group{display:flex;align-items:center;gap:6px}
        
        .ctrl-btn{width:36px;height:36px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:all 0.25s;border:none}
        .ctrl-btn:hover{background:rgba(245,158,11,0.15);border-color:rgba(245,158,11,0.4);transform:translateY(-2px)}
        .ctrl-btn:active{transform:scale(0.9)}
        .ctrl-btn svg{width:15px;height:15px;fill:currentColor}
        
        .time{font-size:10px;color:#999;min-width:75px;text-align:center;font-weight:500}
        
        .volume-group{display:flex;align-items:center;gap:5px;position:relative}
        .volume-slider{width:0;height:3px;background:rgba(255,255,255,0.1);border-radius:10px;cursor:pointer;transition:width 0.3s;overflow:visible}
        .volume-group:hover .volume-slider{width:55px}
        .volume-fill{height:100%;background:var(--gradient);border-radius:10px;width:100%}
        
        .speed-btn{font-size:8px;font-weight:700;color:#f59e0b;background:rgba(245,158,11,0.1);padding:3px 6px;border-radius:4px;cursor:pointer;border:none}
        
        .ripple{position:absolute;width:30px;height:30px;background:rgba(245,158,11,0.3);border-radius:50%;transform:scale(0);pointer-events:none;animation:rippleAnim 0.6s ease-out}
        
        .info-bar{font-size:11px;color:var(--text2);margin-top:14px;text-align:center}
        .back-btn{display:inline-block;margin-top:12px;padding:10px 22px;border-radius:50px;background:var(--gradient);color:#fff;text-decoration:none;font-weight:700;font-size:13px;transition:all 0.3s;border:none;cursor:pointer}
        .back-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(245,158,11,0.4)}
    </style>
</head>
<body>
    <h1>PIVOT BOX</h1>
    <p class="subtitle">Reproductor Test v2</p>
    
    <div class="player-shell" id="playerShell">
        <video id="videoEl" crossorigin="anonymous" preload="auto" playsinline></video>
        <div class="top-gradient"></div>
        <div class="bottom-gradient"></div>
        <div class="title-overlay" id="titleEl">Cargando...</div>
        <button class="play-overlay" id="playOverlay">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="spinner" id="spinner"></div>
        <div class="watermark">
            <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
            Pivot Box
        </div>
        <div class="controls">
            <div class="progress" id="progressEl">
                <div class="progress-bar" id="progressBar"></div>
                <div class="progress-knob" id="progressKnob"></div>
            </div>
            <div class="controls-row">
                <div class="left-group">
                    <button class="ctrl-btn" id="playBtn">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <div class="volume-group">
                        <button class="ctrl-btn" id="volumeBtn">
                            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
                        </button>
                        <div class="volume-slider" id="volumeSlider">
                            <div class="volume-fill" id="volumeFill"></div>
                        </div>
                    </div>
                    <span class="time" id="timeEl">0:00 / 0:00</span>
                </div>
                <div class="right-group">
                    <button class="speed-btn" id="speedBtn">1x</button>
                    <button class="ctrl-btn" id="fullscreenBtn">
                        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="info-bar" id="infoBar">Cargando...</div>
    <button class="back-btn" onclick="window.location.href='https://pivot-box.vercel.app'">Volver a Pivot Box</button>

    <script>
        var API_BASE = "https://pivot-box.vercel.app";
        var FILE_CODE = "1786860511692-buee57";
        var API_KEY = "pvt-8cDrj1yLLqhxBflFMCUHdDlj";
        
        var shell = document.getElementById('playerShell');
        var video = document.getElementById('videoEl');
        var playOverlay = document.getElementById('playOverlay');
        var playBtn = document.getElementById('playBtn');
        var volumeBtn = document.getElementById('volumeBtn');
        var speedBtn = document.getElementById('speedBtn');
        var fullscreenBtn = document.getElementById('fullscreenBtn');
        var progressEl = document.getElementById('progressEl');
        var progressBar = document.getElementById('progressBar');
        var progressKnob = document.getElementById('progressKnob');
        var timeEl = document.getElementById('timeEl');
        var volumeSlider = document.getElementById('volumeSlider');
        var volumeFill = document.getElementById('volumeFill');
        var spinner = document.getElementById('spinner');
        var titleEl = document.getElementById('titleEl');
        var infoBar = document.getElementById('infoBar');
        
        var idleTimer;
        var speeds = [0.5, 0.75, 1, 1.25, 1.5, 2];
        var speedIdx = 2;
        
        function fmt(t){if(isNaN(t)||t<0)return"0:00";var m=Math.floor(t/60);var s=Math.floor(t%60);return m+":"+(s<10?"0":"")+s;}
        
        function resetIdle(){shell.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(function(){if(!video.paused)shell.classList.add('idle');},2800);}
        
        function togglePlay(){var p=video.paused?video.play():video.pause();if(p&&p.then)p.catch(function(){});}
        
        shell.addEventListener('mousemove',resetIdle);
        shell.addEventListener('touchstart',resetIdle);
        
        video.addEventListener('play',function(){playOverlay.classList.add('hidden');playBtn.innerHTML='<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';resetIdle();});
        video.addEventListener('pause',function(){playOverlay.classList.remove('hidden');playBtn.innerHTML='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';shell.classList.remove('idle');});
        video.addEventListener('waiting',function(){spinner.style.display='block';});
        video.addEventListener('canplay',function(){spinner.style.display='none';});
        video.addEventListener('timeupdate',function(){var pct=(video.currentTime/video.duration)*100||0;progressBar.style.width=pct+'%';progressKnob.style.left=pct+'%';timeEl.textContent=fmt(video.currentTime)+' / '+fmt(video.duration);});
        
        playOverlay.addEventListener('click',togglePlay);
        video.addEventListener('click',togglePlay);
        playBtn.addEventListener('click',togglePlay);
        
        progressEl.addEventListener('click',function(e){var r=progressEl.getBoundingClientRect();video.currentTime=((e.clientX-r.left)/r.width)*video.duration;});
        
        volumeBtn.addEventListener('click',function(){video.muted=!video.muted;updateVol();});
        volumeSlider.addEventListener('click',function(e){var r=volumeSlider.getBoundingClientRect();var p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));video.volume=p;video.muted=false;updateVol();});
        function updateVol(){var v=video.muted?0:video.volume;volumeFill.style.width=(v*100)+'%';}
        
        speedBtn.addEventListener('click',function(){speedIdx=(speedIdx+1)%speeds.length;video.playbackRate=speeds[speedIdx];speedBtn.textContent=speeds[speedIdx]+'x';});
        fullscreenBtn.addEventListener('click',function(){if(document.fullscreenElement){document.exitFullscreen();}else{shell.requestFullscreen();}});
        
        document.addEventListener('keydown',function(e){
            switch(e.key){
                case ' ':case 'k':e.preventDefault();togglePlay();break;
                case 'ArrowLeft':e.preventDefault();video.currentTime-=5;break;
                case 'ArrowRight':e.preventDefault();video.currentTime+=5;break;
                case 'ArrowUp':e.preventDefault();video.volume=Math.min(1,video.volume+0.1);updateVol();break;
                case 'ArrowDown':e.preventDefault();video.volume=Math.max(0,video.volume-0.1);updateVol();break;
                case 'm':e.preventDefault();video.muted=!video.muted;updateVol();break;
                case 'f':e.preventDefault();if(document.fullscreenElement){document.exitFullscreen();}else{shell.requestFullscreen();}break;
            }
        });
        
        async function load(){
            try{
                infoBar.textContent='Obteniendo información del video...';
                var r=await fetch(API_BASE+'/api/file?id='+FILE_CODE+'&key='+API_KEY);
                var d=await r.json();
                
                if(d.success&&d.url){
                    var streamUrl=API_BASE+'/api/file?action=stream&url='+encodeURIComponent(d.url)+'&key='+API_KEY;
                    video.src=streamUrl;
                    titleEl.textContent=d.name||'Video';
                    infoBar.textContent='Video cargado correctamente';
                    
                    video.addEventListener('loadedmetadata',function(){infoBar.textContent='Duración: '+fmt(video.duration)+' | Anuncios: '+d.ads.count;});
                    video.addEventListener('error',function(){infoBar.textContent='Error al reproducir el video';});
                }else{
                    infoBar.textContent='Error: '+(d.error||'No se pudo obtener info');
                }
            }catch(e){
                infoBar.textContent='Error de conexión';
                console.error(e);
            }
        }
        
        updateVol();
        load();
    </script>
</body>
</html>
