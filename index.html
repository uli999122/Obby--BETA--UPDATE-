<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot DeepSeek Seguro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Modal para ingresar API Key */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
        }

        .modal h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .modal p {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
            font-size: 0.9em;
        }

        .modal input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }

        .modal input:focus {
            border-color: #667eea;
        }

        .modal button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .modal button:hover {
            transform: scale(1.02);
        }

        .warning {
            background: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 0.85em;
            text-align: center;
        }

        /* Chat Container */
        .chat-container {
            width: 90%;
            max-width: 600px;
            height: 80vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            background: #667eea;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .bot-message {
            background: #f0f0f0;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: #f0f0f0;
            padding: 12px 16px;
            border-radius: 18px;
            border-bottom-left-radius: 5px;
        }

        .typing-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        .chat-input {
            display: flex;
            padding: 20px;
            background: #f8f9fa;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }

        #user-input:focus {
            border-color: #667eea;
        }

        #send-button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: transform 0.2s;
        }

        #send-button:hover {
            transform: scale(1.05);
        }

        #send-button:active {
            transform: scale(0.95);
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 10px;
            margin: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Modal para API Key -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h2>🔐 Ingresa tu API Key</h2>
            <div class="warning">
                ⚠️ Tu API key se mantiene solo en tu navegador y no se guarda en ningún servidor
            </div>
            <p>Obtén tu API key gratuita en:<br><strong>platform.deepseek.com</strong></p>
            <input 
                type="password" 
                id="api-key-input" 
                placeholder="sk-..."
                autocomplete="off"
            >
            <button onclick="setApiKey()">Conectar</button>
        </div>
    </div>

    <!-- Chat Container -->
    <div class="chat-container" id="chat-container">
        <div class="chat-header">
            <span>🤖 Chatbot DeepSeek</span>
            <button class="logout-btn" onclick="logout()">Cambiar Key</button>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message bot-message">
                ¡Hola! Estoy conectado con DeepSeek. ¿En qué puedo ayudarte?
            </div>
        </div>

        <div class="typing-indicator" id="typing-indicator">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
        </div>

        <div class="chat-input">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Escribe tu mensaje..."
                autocomplete="off"
            >
            <button id="send-button">Enviar</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.deepseek.com/v1/chat/completions';
        
        let apiKey = '';
        let conversationHistory = [
            {
                role: "system",
                content: "Eres un asistente útil y amigable."
            }
        ];

        // Elementos del DOM
        const modalOverlay = document.getElementById('modal-overlay');
        const chatContainer = document.getElementById('chat-container');
        const apiKeyInput = document.getElementById('api-key-input');
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const typingIndicator = document.getElementById('typing-indicator');

        function setApiKey() {
            const key = apiKeyInput.value.trim();
            
            if (!key) {
                alert('Por favor ingresa tu API key');
                return;
            }
            
            if (!key.startsWith('sk-')) {
                alert('La API key debe comenzar con "sk-"');
                return;
            }
            
            apiKey = key;
            apiKeyInput.value = '';
            
            // Mostrar chat y ocultar modal
            modalOverlay.style.display = 'none';
            chatContainer.style.display = 'flex';
            
            // Limpiar historial
            conversationHistory = [
                {
                    role: "system",
                    content: "Eres un asistente útil y amigable."
                }
            ];
            
            // Limpiar mensajes anteriores
            chatMessages.innerHTML = `
                <div class="message bot-message">
                    ¡Conexión exitosa! Soy un chatbot con DeepSeek. ¿En qué puedo ayudarte?
                </div>
            `;
            
            userInput.focus();
        }

        function logout() {
            apiKey = '';
            conversationHistory = [
                {
                    role: "system",
                    content: "Eres un asistente útil y amigable."
                }
            ];
            
            // Mostrar modal y ocultar chat
            modalOverlay.style.display = 'flex';
            chatContainer.style.display = 'none';
            
            // Limpiar mensajes
            chatMessages.innerHTML = `
                <div class="message bot-message">
                    ¡Hola! Estoy conectado con DeepSeek. ¿En qué puedo ayudarte?
                </div>
            `;
            
            apiKeyInput.focus();
        }

        function addMessage(content, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            messageDiv.textContent = content;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTypingIndicator() {
            typingIndicator.style.display = 'block';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTypingIndicator() {
            typingIndicator.style.display = 'none';
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            
            if (!message) return;
            
            if (!apiKey) {
                alert('Por favor ingresa tu API key primero');
                logout();
                return;
            }
            
            // Limpiar input
            userInput.value = '';
            
            // Agregar mensaje del usuario
            addMessage(message, true);
            conversationHistory.push({
                role: "user",
                content: message
            });
            
            // Mostrar indicador de escritura
            showTypingIndicator();
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: conversationHistory,
                        temperature: 0.7,
                        max_tokens: 1000
                    })
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        throw new Error('API key inválida');
                    } else if (response.status === 429) {
                        throw new Error('Límite de solicitudes alcanzado');
                    } else {
                        throw new Error(`Error: ${response.status}`);
                    }
                }
                
                const data = await response.json();
                const botResponse = data.choices[0].message.content;
                
                // Agregar respuesta del bot
                addMessage(botResponse, false);
                conversationHistory.push({
                    role: "assistant",
                    content: botResponse
                });
                
            } catch (error) {
                console.error('Error:', error);
                
                let errorMsg = 'Lo siento, hubo un error. ';
                
                if (error.message.includes('API key inválida')) {
                    errorMsg += 'Tu API key no es válida. Por favor verifica e intenta de nuevo.';
                    // Mostrar modal para nueva key
                    setTimeout(() => logout(), 2000);
                } else if (error.message.includes('Límite')) {
                    errorMsg += 'Has alcanzado el límite de solicitudes. Intenta más tarde.';
                } else {
                    errorMsg += 'Por favor intenta de nuevo.';
                }
                
                addMessage(errorMsg, false);
            } finally {
                hideTypingIndicator();
            }
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);
        
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        apiKeyInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                setApiKey();
            }
        });
        
        // Focus en el input de API key al cargar
        apiKeyInput.focus();
    </script>
</body>
</html>
