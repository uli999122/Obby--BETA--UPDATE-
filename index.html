<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pivot Music • Streaming de Música</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;font-family:'Inter',sans-serif;color:#fff}
        .header{padding:16px 24px;background:#0f0f0f;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between;align-items:center}
        .logo{display:flex;align-items:center;gap:12px}
        .logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#10b981,#059669);border-radius:12px;display:flex;align-items:center;justify-content:center}
        .container{max-width:1000px;margin:0 auto;padding:20px}
        .track-list{display:flex;flex-direction:column;gap:12px}
        .track-item{background:#0f0f0f;border-radius:12px;padding:16px;display:flex;align-items:center;gap:16px;border:1px solid #2a2a2a;cursor:pointer}
        .track-item:hover{background:#1a1a1a}
        .track-icon{width:48px;height:48px;background:linear-gradient(135deg,#10b981,#059669);border-radius:12px;display:flex;align-items:center;justify-content:center}
        .track-info{flex:1}
        .track-title{font-weight:600}
        .track-artist{font-size:12px;color:#888}
        .track-duration{color:#888;font-size:12px}
        .player{position:fixed;bottom:0;left:0;right:0;background:#0f0f0f;border-top:1px solid #2a2a2a;padding:16px;display:flex;align-items:center;gap:20px}
        .player-info{flex:1}
        .player-controls{display:flex;gap:16px}
        .player-controls button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
        .progress-bar{height:4px;background:#2a2a2a;border-radius:2px;flex:1;cursor:pointer}
        .progress-fill{height:100%;background:#10b981;border-radius:2px;width:0%}
        .eco-nav{display:flex;gap:8px;padding:8px 16px;background:#0a0a0a;border-bottom:1px solid #2a2a2a;overflow-x:auto}
        .eco-link{color:#888;text-decoration:none;font-size:12px;padding:6px 12px;border-radius:20px;background:#1a1a1a;white-space:nowrap}
        .eco-link.active{background:#10b981;color:#fff}
        .status{font-size:11px;color:#10b981}
        audio{display:none}
    </style>
</head>
<body>
<div class="eco-nav">
    <a href="https://pivot-lax.vercel.app" class="eco-link">📹 Lax</a>
    <a href="https://pivot-tv.vercel.app" class="eco-link">📺 TV</a>
    <a href="https://pivot-kids.vercel.app" class="eco-link">🧒 Kids</a>
    <a href="#" class="eco-link active">🎵 Music</a>
    <a href="https://pivot-ai.vercel.app" class="eco-link">🧠 AI</a>
    <a href="https://pivot-news.vercel.app" class="eco-link">📰 News</a>
    <a href="https://pivot-studio.vercel.app" class="eco-link">🎬 Studio</a>
    <a href="https://pivot-nexus.vercel.app" class="eco-link">🌐 Nexus</a>
    <a href="https://pivot-video.vercel.app" class="eco-link">🎬 Video</a>
    <a href="https://pivot-design.vercel.app" class="eco-link">🎨 Design</a>
    <a href="https://pivot-shop.vercel.app" class="eco-link">🛍️ Shop</a>
    <a href="https://pivot-pay.vercel.app" class="eco-link">💳 Pay</a>
    <a href="https://pivot-academy.vercel.app" class="eco-link">📚 Academy</a>
    <a href="https://pivot-crm.vercel.app" class="eco-link">📊 CRM</a>
    <a href="https://pivot-forms.vercel.app" class="eco-link">📝 Forms</a>
    <a href="https://pivot-analytics.vercel.app" class="eco-link">📈 Analytics</a>
    <a href="https://pivot-health.vercel.app" class="eco-link">❤️ Health</a>
    <a href="https://pivot-translate.vercel.app" class="eco-link">🌐 Translate</a>
    <a href="https://pivot-vpn.vercel.app" class="eco-link">🔒 VPN</a>
    <a href="https://pivot-vault.vercel.app" class="eco-link">🔐 Vault</a>
    <a href="https://pivot-comics.vercel.app" class="eco-link">📖 Comics</a>
    <a href="https://pivot-manager.vercel.app" class="eco-link">📦 Manager</a>
    <a href="https://pivot-cloud.vercel.app" class="eco-link">☁️ Cloud</a>
</div>
<header class="header"><div class="logo"><div class="logo-icon"><i class="fas fa-music"></i></div><span class="logo-text">PIVOT MUSIC</span></div><div><span class="status" id="connectionStatus">🟢 Conectando...</span></div></header>
<div class="container"><h1 style="margin-bottom:20px">🎧 Lo más escuchado</h1><div class="track-list" id="trackList"></div></div>
<div class="player" id="player" style="display:none"><div class="player-info"><div id="nowPlaying">Selecciona una canción</div><div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div></div><div class="player-controls"><button onclick="playPause()"><i class="fas fa-play" id="playPauseBtn"></i></button><button onclick="nextTrack()"><i class="fas fa-forward"></i></button><button onclick="prevTrack()"><i class="fas fa-backward"></i></button></div></div>
<audio id="audio"></audio>
<script>
const PIVOT_CLOUD_URL='https://pivot-cloud.vercel.app',PLATFORM_ID='music';
async function loadCredentials(){try{await fetch(`${PIVOT_CLOUD_URL}/api/credentials/${PLATFORM_ID}`,{mode:'cors'});document.getElementById('connectionStatus').innerHTML='🟢 Conectado'}catch(e){document.getElementById('connectionStatus').innerHTML='🟡 Modo local'}}
const tracks=[{title:'Blinding Lights',artist:'The Weeknd',duration:'3:20'},{title:'Flowers',artist:'Miley Cyrus',duration:'3:25'},{title:'As It Was',artist:'Harry Styles',duration:'2:47'},{title:'Anti-Hero',artist:'Taylor Swift',duration:'3:20'},{title:'Unholy',artist:'Sam Smith',duration:'2:36'},{title:'Cruel Summer',artist:'Taylor Swift',duration:'2:58'}];
let currentTrack=0,isPlaying=false,audio=document.getElementById('audio');
function renderTracks(){document.getElementById('trackList').innerHTML=tracks.map((t,i)=>`<div class="track-item" onclick="playTrack(${i})"><div class="track-icon"><i class="fas fa-music"></i></div><div class="track-info"><div class="track-title">${t.title}</div><div class="track-artist">${t.artist}</div></div><div class="track-duration">${t.duration}</div></div>`).join('');}
function playTrack(i){currentTrack=i;document.getElementById('nowPlaying').innerHTML=`${tracks[i].title} - ${tracks[i].artist}`;document.getElementById('player').style.display='flex';audio.src=`https://www.soundhelix.com/examples/mp3/SoundHelix-Song-${i+1}.mp3`;audio.play();isPlaying=true;document.getElementById('playPauseBtn').innerHTML='<i class="fas fa-pause"></i>';}
function playPause(){if(isPlaying){audio.pause();document.getElementById('playPauseBtn').innerHTML='<i class="fas fa-play"></i>'}else{audio.play();document.getElementById('playPauseBtn').innerHTML='<i class="fas fa-pause"></i>'}isPlaying=!isPlaying;}
function nextTrack(){playTrack((currentTrack+1)%tracks.length);}
function prevTrack(){playTrack((currentTrack-1+tracks.length)%tracks.length);}
audio.addEventListener('timeupdate',()=>{if(audio.duration){document.getElementById('progressFill').style.width=(audio.currentTime/audio.duration)*100+'%'}});
renderTracks();loadCredentials();
</script>
</body>
</html>
