<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pivot Box - Test Player</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;color:#fff}
        h1{font-size:24px;margin-bottom:10px;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        p{font-size:12px;color:#888;margin-bottom:20px}
        .player-container{width:100%;max-width:800px;background:#000;border-radius:16px;overflow:hidden;box-shadow:0 0 40px rgba(245,158,11,0.2)}
        video{width:100%;display:block;max-height:500px;background:#000}
        .info{font-size:12px;color:#888;margin-top:10px;text-align:center}
        .btn{display:inline-block;margin-top:15px;padding:12px 24px;border-radius:50px;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;text-decoration:none;font-weight:700;font-size:14px;transition:all 0.3s}
        .btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(245,158,11,0.4)}
    </style>
</head>
<body>
    <h1>PIVOT BOX - TEST PLAYER</h1>
    <p>Prueba de reproducción con proxy CORS</p>
    
    <div class="player-container">
        <video id="videoPlayer" controls autoplay crossorigin="anonymous" playsinline></video>
    </div>
    
    <div class="info" id="statusText">Cargando video...</div>
    
    <a href="https://pivot-box.vercel.app" class="btn">Volver a Pivot Box</a>

    <script>
        var API_BASE = "https://pivot-box.vercel.app";
        var FILE_CODE = "1786849938065-bczmpm";
        var API_KEY = "pvt-ecgRfCeFhf89YBDvbLwmT6KO";
        
        async function loadVideo() {
            try {
                // Paso 1: Obtener info del archivo de la API
                var response = await fetch(API_BASE + '/api/file?id=' + FILE_CODE + '&key=' + API_KEY);
                var data = await response.json();
                
                console.log('API Response:', data);
                
                if (data.success && data.url) {
                    // Paso 2: Construir URL con proxy CORS
                    var proxyUrl = 'https://corsfix.com/?' + encodeURIComponent(data.url);
                    
                    console.log('Proxy URL:', proxyUrl);
                    
                    // Paso 3: Cargar en el video player
                    var video = document.getElementById('videoPlayer');
                    video.src = proxyUrl;
                    
                    document.getElementById('statusText').textContent = 
                        'Archivo: ' + data.name + ' | Tamaño: ' + (data.size/1024/1024).toFixed(2) + ' MB | Vistas: ' + data.stats.views;
                    
                    video.addEventListener('loadedmetadata', function() {
                        document.getElementById('statusText').textContent += ' | ✅ CARGADO';
                    });
                    
                    video.addEventListener('error', function(e) {
                        document.getElementById('statusText').textContent = '❌ ERROR AL CARGAR - Probando proxy alternativo...';
                        
                        // Intentar con otro proxy
                        var altProxy = 'https://whateverorigin.org/?' + encodeURIComponent(data.url);
                        video.src = altProxy;
                    });
                    
                } else {
                    document.getElementById('statusText').textContent = '❌ Error: ' + (data.error || 'No se pudo obtener info');
                }
            } catch (e) {
                document.getElementById('statusText').textContent = '❌ Error de conexión: ' + e.message;
                console.error('Error:', e);
            }
        }
        
        loadVideo();
    </script>
</body>
</html>
