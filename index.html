<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pivot Agent · Chat IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0d1425 100%);
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-card {
            max-width: 750px;
            width: 100%;
            background: rgba(18, 25, 45, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .header {
            background: rgba(10, 15, 27, 0.9);
            padding: 18px 24px;
            border-bottom: 1px solid #1e2a3a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(145deg, #2563eb, #1e40af);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .logo-area h1 {
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .logo-area p {
            color: #94a3b8;
            font-size: 0.7rem;
        }

        .badge {
            background: #05966920;
            padding: 6px 14px;
            border-radius: 30px;
            color: #34d399;
            font-size: 0.7rem;
            font-weight: 500;
            border: 1px solid #34d39940;
        }

        .messages {
            height: 480px;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 85%;
            animation: fadeIn 0.25s ease;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 34px;
            height: 34px;
            background: #1e293b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: #3b82f6;
        }

        .bubble {
            background: #1e293b;
            padding: 10px 16px;
            border-radius: 20px;
            color: #e2e8f0;
            font-size: 0.9rem;
            line-height: 1.45;
            border: 1px solid #334155;
        }

        .message.user .bubble {
            background: linear-gradient(115deg, #2563eb, #1e3a8a);
            border: none;
            border-bottom-right-radius: 6px;
        }

        .message.ai .bubble {
            border-bottom-left-radius: 6px;
        }

        .typing {
            display: flex;
            gap: 5px;
            padding: 8px 16px;
            background: #0f172a;
            width: fit-content;
            border-radius: 24px;
            margin-left: 44px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #60a5fa;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-area {
            padding: 18px 24px 24px;
            background: #0a0f1a;
            border-top: 1px solid #1e2a3a;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            background: #0f172a;
            border-radius: 60px;
            padding: 4px 4px 4px 20px;
            border: 1px solid #334155;
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 0;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: #5b6e8c;
        }

        .send-button {
            background: #2563eb;
            border: none;
            border-radius: 60px;
            padding: 8px 24px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }

        .send-button:hover {
            background: #3b82f6;
            transform: scale(0.96);
        }

        .footer {
            font-size: 0.65rem;
            text-align: center;
            padding: 8px;
            color: #475569;
        }

        .messages::-webkit-scrollbar {
            width: 5px;
        }
        .messages::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .messages::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .message { max-width: 95%; }
            .messages { height: 420px; }
        }
    </style>
</head>
<body>

<div class="chat-card">
    <div class="header">
        <div class="logo-area">
            <div class="icon">⚡</div>
            <div>
                <h1>Pivot Agent</h1>
                <p>IA avanzada</p>
            </div>
        </div>
        <div class="badge">✓ API Key integrada</div>
    </div>

    <div class="messages" id="messagesList">
        <div class="message ai">
            <div class="avatar">🤖</div>
            <div class="bubble">
                👋 Hola, soy el asistente. Pregúntame lo que quieras.
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="Escribe tu mensaje..." autocomplete="off">
            <button class="send-button" id="sendBtn">Enviar →</button>
        </div>
        <div class="footer">🔐 Usando API key · respuestas en tiempo real</div>
    </div>
</div>

<script>
    // ============================================================
    // SOLO LA API KEY - SIN AGENT ID EN NINGUNA PARTE
    // ============================================================
    const API_KEY = "pivot_1781495746797_dxw64py1";
    
    // El endpoint automáticamente usará el agente asociado a la API Key
    const API_URL = "https://pivot-agent-psi.vercel.app/api/developer/chat";
    
    const messagesDiv = document.getElementById('messagesList');
    const inputField = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    
    let conversationHistory = [];
    
    function addMessage(role, text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;
        
        const avatarSpan = document.createElement('div');
        avatarSpan.className = 'avatar';
        avatarSpan.innerText = role === 'user' ? '👤' : '🤖';
        
        const bubbleSpan = document.createElement('div');
        bubbleSpan.className = 'bubble';
        bubbleSpan.innerText = text;
        
        messageDiv.appendChild(avatarSpan);
        messageDiv.appendChild(bubbleSpan);
        messagesDiv.appendChild(messageDiv);
        messageDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
        
        conversationHistory.push({ role: role === 'user' ? 'user' : 'assistant', content: text });
        if (conversationHistory.length > 20) conversationHistory.shift();
    }
    
    let typingElement = null;
    function showTyping() {
        if (typingElement) return;
        typingElement = document.createElement('div');
        typingElement.className = 'typing';
        typingElement.innerHTML = '<span></span><span></span><span></span>';
        messagesDiv.appendChild(typingElement);
        typingElement.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }
    
    function hideTyping() {
        if (typingElement) {
            typingElement.remove();
            typingElement = null;
        }
    }
    
    async function sendMessage() {
        const userMsg = inputField.value.trim();
        if (!userMsg) return;
        
        addMessage('user', userMsg);
        inputField.value = '';
        inputField.focus();
        
        showTyping();
        
        try {
            const payload = {
                message: userMsg,
                history: conversationHistory.slice(0, -1)
            };
            
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-API-Key': API_KEY
                },
                body: JSON.stringify(payload)
            });
            
            hideTyping();
            
            if (!response.ok) {
                let errMsg = `Error ${response.status}`;
                try {
                    const errData = await response.json();
                    errMsg = errData.error || errData.message || errMsg;
                } catch(e) {}
                throw new Error(errMsg);
            }
            
            const data = await response.json();
            const reply = data.response || data.message || "Respuesta recibida sin contenido.";
            addMessage('ai', reply);
            
        } catch (error) {
            hideTyping();
            addMessage('ai', `❌ Error: ${error.message}. Verifica la conexión.`);
        }
    }
    
    sendBtn.addEventListener('click', sendMessage);
    inputField.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
